<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FlyMario Live — Game</title>
<link rel="stylesheet" href="style.css">
<style>
  .screen{
    background:#000; border-radius: 10px; border: 1px solid var(--line);
    width: 100%; max-width: 480px; margin: 0 auto; overflow:hidden;
  }
  .screen img{ display:block; width:100%; image-rendering: pixelated; }
  .score{ display:flex; justify-content:space-between; max-width:480px; margin:0 auto; font-size:1.1rem; }
  .score .fly{ color: var(--fly); }
  .transport{ display:flex; align-items:center; gap:10px; max-width:480px; margin:0 auto; width:100%; }
  button{
    font-family: inherit; font-size: 0.78rem; cursor:pointer;
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px;
  }
  button.active{ background: var(--fly); color: var(--bg); border-color: var(--fly); }
  input[type=range]{ flex:1; accent-color: var(--fly); }
  .speedrow{ display:flex; gap:6px; max-width:480px; margin:0 auto; width:100%; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>FlyMario Live — <span>Game</span></h1>
  <div class="tabnav">
    <a class="active" href="game.html">Game</a>
    <a href="fly.html">Fly</a>
    <a href="brain.html">Brain</a>
  </div>

  <div class="score">
    <span>enemy <b id="scoreEnemy">0</b></span>
    <span class="status live" id="liveStatus">connecting</span>
    <span class="fly">fly <b id="scorePlayer">0</b></span>
  </div>

  <div class="screen"><img id="frame" src="frame.png" alt="live Pong frame"></div>

  <div class="transport">
    <button id="pauseBtn">⏸ pause</button>
    <span id="pointLabel" style="font-size:0.72rem;color:var(--ink-dim);">point 0, step 0</span>
  </div>

  <div class="panel">
    <h2>Playback speed — slow it down to watch the fly think</h2>
    <div class="speedrow" id="speedRow"></div>
  </div>
</div>

<script>
const SPEEDS = [0.1, 0.25, 0.5, 1, 2, 4];
const speedRow = document.getElementById('speedRow');
let currentSpeed = 1;
SPEEDS.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s + 'x';
  b.className = s === 1 ? 'active' : '';
  b.addEventListener('click', () => setSpeed(s, b));
  speedRow.appendChild(b);
});

function setSpeed(s, btn){
  currentSpeed = s;
  [...speedRow.children].forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  fetch('speed', { method:'POST', body: JSON.stringify({speed: s}) }).catch(()=>{});
}

let paused = false;
document.getElementById('pauseBtn').addEventListener('click', () => {
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶ resume' : '⏸ pause';
  fetch('pause', { method:'POST', body: JSON.stringify({paused}) }).catch(()=>{});
});

const frameImg = document.getElementById('frame');
const liveStatus = document.getElementById('liveStatus');
let lastOkAt = 0;

function poll(){
  fetch('state.json').then(r => r.json()).then(s => {
    document.getElementById('scorePlayer').textContent = s.score_player;
    document.getElementById('scoreEnemy').textContent = s.score_enemy;
    document.getElementById('pointLabel').textContent = `point ${s.episode}, step ${s.step}`;
    lastOkAt = Date.now();
    liveStatus.className = 'status live'; liveStatus.textContent = 'live';
  }).catch(()=>{
    if(Date.now() - lastOkAt > 2000){ liveStatus.className='status stale'; liveStatus.textContent='disconnected'; }
  });
  frameImg.src = 'frame.png?t=' + Date.now();
}
setInterval(poll, 100);
poll();
</script>
</body>
</html>
